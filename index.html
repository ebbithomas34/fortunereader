<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>FortuneReader | The AI Software for Counselors</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Helvetica Neue', Arial, sans-serif; background-color: #FFFBEB; height: 100vh; display: flex; justify-content: center; align-items: center; color: #1a1a1a; overflow: hidden; }
        .container { max-width: 650px; width: 90%; text-align: center; border: 1px solid #e5e2d5; padding: 35px 45px; background: #fffdf5; box-shadow: 0 10px 30px rgba(0,0,0,0.02); display: flex; flex-direction: column; justify-content: space-between; max-height: 95vh; }
        header { margin-bottom: 25px; text-align: center; }
        h1 { font-size: 2.2rem; font-weight: 300; letter-spacing: 2px; margin: 0; }
        .subtitle { font-size: 0.7rem; letter-spacing: 3px; color: #8a8375; text-transform: uppercase; font-weight: bold; margin-top: 5px; }
        .counter-strip { display: none; grid-template-columns: 1fr 1fr 1fr; gap: 1px; background-color: #e5e2d5; border: 1px solid #e5e2d5; margin-bottom: 25px; }
        .counter-strip.visible { display: grid; }
        .stat-box { background: #fffdf5; padding: 12px; }
        .stat-label { font-size: 0.6rem; color: #8a8375; display: block; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 4px; }
        .stat-value { font-size: 1.2rem; font-weight: 300; }
        .stage-area { display: none; min-height: 200px; flex-direction: column; justify-content: center; }
        .stage-area.visible { display: flex; }
        .q-text { font-size: 1.6rem; font-weight: 300; margin-bottom: 12px; line-height: 1.3; color: #111; }
        .q-guide { font-size: 0.9rem; color: #8a8375; font-style: italic; margin-bottom: 25px; line-height: 1.5; }
        .btn-group { display: flex; justify-content: center; gap: 15px; }
        .gemini-btn { flex: 1; padding: 18px 0; background: #1a1a1a; color: #fff; border: none; cursor: pointer; font-size: 0.75rem; letter-spacing: 2px; text-transform: uppercase; font-weight: bold; transition: all 0.2s; }
        .gemini-btn:hover { background: #444; }
        .gemini-btn.secondary { background: #e5e2d5; color: #1a1a1a; border: 1px solid #d1cec0; }
        footer { margin-top: 30px; padding-top: 20px; border-top: 2px solid #1a1a1a; }
        .tagline { font-size: 0.8rem; font-weight: 600; letter-spacing: 3px; color: #1a1a1a; text-transform: uppercase; }
        .result-screen { display: none; text-align: center; animation: fadeIn 0.4s ease; }
        .result-screen.visible { display: block; }
        #rTitle { font-weight: 300; font-size: 1.8rem; margin-bottom: 15px; }
        #rDesc { margin: 20px 0; color: #444; line-height: 1.6; font-size: 1rem; background: #fdfdfd; padding: 20px; border: 1px solid #efefef; max-height: 180px; overflow-y: auto; text-align: left; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>FortuneReader</h1>
            <div class="subtitle">The 10 Minute AI Software for Counselors</div>
        </header>

        <div class="counter-strip" id="counterStrip">
            <div class="stat-box"><span class="stat-label">Current Pool</span><span class="stat-value" id="valCur">—</span></div>
            <div class="stat-box"><span class="stat-label">If Agree</span><span class="stat-value" id="valYes">—</span></div>
            <div class="stat-box"><span class="stat-label">If Disagree</span><span class="stat-value" id="valNo">—</span></div>
        </div>

        <div id="welcome">
            <p style="font-size:0.85rem; margin-bottom:12px; color:#8a8375; font-style: italic;">Load the local dataset to initialize the matrix.</p>
            <button class="gemini-btn" onclick="document.getElementById('csvFile').click()">||| BEGIN |||</button>
            <input type="file" id="csvFile" accept=".csv" style="display: none;" />
        </div>

        <div class="stage-area" id="stageArea">
            <div id="qText" class="q-text"></div>
            <div id="qGuide" class="q-guide"></div>
            <div class="btn-group">
                <button class="gemini-btn" onclick="handleAnswer('YES')">Agree</button>
                <button class="gemini-btn secondary" onclick="handleAnswer('NO')">Disagree</button>
            </div>
        </div>

        <div class="result-screen" id="resultArea">
            <h2 id="rTitle"></h2>
            <div id="rDesc"></div>
            <div class="btn-group">
                <button class="gemini-btn" onclick="copyAIPrompt()">Copy for Gemini Analysis</button>
                <button class="gemini-btn secondary" onclick="location.reload()">New Iteration</button>
            </div>
        </div>

        <footer><div class="tagline">1,048,576 Paths To AI-Proof Your Students</div></footer>
    </div>

<script>
    let MASTER = [];
    let poolQ = []; 
    let poolJ = []; 
    let stage = 1; 
    let sessionHistory = ""; // Records EVERYTHING (Agree & Disagree)

    document.getElementById('csvFile').onchange = (e) => {
        Papa.parse(e.target.files[0], {
            header: false, skipEmptyLines: true,
            complete: (res) => { processData(res.data); }
        });
    };

    function processData(rawData) {
        MASTER = rawData.map(row => row.map(cell => cell ? cell.toString().replace(/[^\x20-\x7E]/g, "").trim() : ""));
        MASTER.forEach(row => {
            if (row[0] && row[0].toLowerCase() === "index") {
                if (row[2].toLowerCase() === "question") poolQ.push(row[1]);
                if (row[2].toLowerCase() === "result") poolJ.push(row[1]);
            }
        });
        document.getElementById('welcome').style.display = 'none';
        document.getElementById('counterStrip').classList.add('visible');
        document.getElementById('stageArea').classList.add('visible');
        next();
    }

    function prune() {
        poolQ = poolQ.filter(qid => {
            let qRow = MASTER.find(r => r[1] === qid);
            if (!qRow) return false;
            if (qRow[0].toLowerCase() === 'resultquestion') return true;
            if (qRow[3].toLowerCase() === 'stage1_riase' && stage === 1) return true;
            return MASTER.some(r => r[0].toLowerCase().includes('links') && r[4] === qid && poolJ.includes(r[2]));
        });
    }

    function calculate(isAgree) {
        if (stage === 1) {
            return isAgree ? poolJ.filter(jid => {
                let jRow = MASTER.find(r => r[1] === jid);
                return jRow && jRow[4] === window.currentQ.riase;
            }) : poolJ;
        } else {
            let linked = MASTER.filter(r => r[0].toLowerCase().includes('links') && r[4] === window.currentQ.id).map(r => r[2]);
            let filtered = isAgree ? poolJ.filter(id => linked.includes(id)) : poolJ.filter(id => !linked.includes(id));
            return filtered.length > 0 ? filtered : poolJ;
        }
    }

    function next() {
        prune();
        if (poolJ.length === 0) { showFinal("A Unique Path", "Your evaluations suggest a profile that transcends categorization."); return; }
        if (poolQ.length === 0 || poolJ.length === 1) { stage = 3; displayGate(); return; }
        const tags = { 1: "stage1_riase", 2: "stage2_differentiator" };
        let nextQID = poolQ.find(id => {
            let row = MASTER.find(r => r[1] === id);
            return row && row[3].toLowerCase() === tags[stage];
        });
        if (!nextQID) { if (stage < 2) { stage++; next(); } else { stage = 3; next(); } return; }
        let qRow = MASTER.find(r => r[1] === nextQID);
        window.currentQ = { id: qRow[1], type: qRow[3].toLowerCase(), riase: qRow[4], text: qRow[2] };
        let yesPool = calculate(true);
        let noPool = calculate(false);
        updateUI(qRow[2], qRow[5], poolJ.length, yesPool.length, noPool.length);
    }

    function handleAnswer(ans) {
        let isAgree = (ans === 'YES');
        
        // Record the decision regardless of Agree or Disagree
        let prefix = isAgree ? "Agree: " : "Disagree: ";
        sessionHistory += prefix + window.currentQ.text + ". ";

        if (stage === 3) {
            if (isAgree) { showFinalDetails(poolJ[0]); }
            else { 
                poolJ.shift(); 
                if (poolJ.length === 0) showFinal("Unworkable Selections", "680 occupations. Its Your Life! Find your workable combination!");
                else next();
            }
            return;
        }

        if (stage === 1 && isAgree) {
            poolJ = calculate(true); stage = 2;
        } else if (stage === 2) {
            poolJ = calculate(isAgree);
        }
        poolQ = poolQ.filter(id => id !== window.currentQ.id);
        next();
    }

    function updateUI(t, g, c, y, n) {
        document.getElementById('qText').innerText = t;
        document.getElementById('qGuide').innerText = g || "";
        document.getElementById('valCur').innerText = c;
        document.getElementById('valYes').innerText = y;
        document.getElementById('valNo').innerText = n;
    }

    function displayGate() {
        let currentJobID = poolJ[0];
        let rqRow = MASTER.find(r => r[0].toLowerCase() === "resultquestion" && r[1] === currentJobID);
        updateUI(rqRow ? rqRow[2] : "Result Candidate: " + currentJobID, rqRow ? rqRow[3] : "Do you accept this path?", poolJ.length, 1, poolJ.length - 1);
    }

    function showFinalDetails(jid) {
        let job = MASTER.find(r => r[0].toLowerCase() === "result" && r[1] === jid);
        showFinal(job ? job[2] : jid, job ? job[5] : "Evaluation accepted.");
    }

    function showFinal(title, desc) {
        document.getElementById('stageArea').classList.remove('visible');
        document.getElementById('counterStrip').classList.remove('visible');
        document.getElementById('resultArea').classList.add('visible');
        document.getElementById('rTitle').innerText = title;
        document.getElementById('rDesc').innerText = desc;
    }

    function copyAIPrompt() {
        const title = document.getElementById('rTitle').innerText;
        const prompt = `Student Career Discovery Data:\nFinal Occupation Result: ${title}.\n\nFull Decision History (Audit Trail):\n${sessionHistory}\n\nAct as a career counselor. Based on this specific result and the history of choices provided above, provide a personalized roadmap for building human-centric, AI-proof skills.`;
        navigator.clipboard.writeText(prompt).then(() => alert("Full Audit Trail copied."));
    }
</script>
</body>
</html>
