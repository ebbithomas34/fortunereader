<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>FortuneReader - Counselor Edition</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Helvetica Neue', Arial, sans-serif; background-color: #FFFBEB; height: 100vh; display: flex; justify-content: center; align-items: center; color: #1a1a1a; }
        .container { max-width: 650px; width: 90%; text-align: center; border: 1px solid #e5e2d5; padding: 40px; background: #fffdf5; box-shadow: 0 10px 30px rgba(0,0,0,0.02); }
        
        /* Header Branding */
        header { margin-bottom: 35px; }
        h1 { font-size: 2.4rem; font-weight: 200; letter-spacing: 6px; text-transform: none; margin-bottom: 5px; }
        .subtitle { font-size: 0.7rem; letter-spacing: 3px; color: #8a8375; text-transform: uppercase; font-weight: 400; }
        
        /* Counters */
        .counter-strip { display: none; grid-template-columns: 1fr 1fr 1fr; gap: 1px; background-color: #e5e2d5; border: 1px solid #e5e2d5; margin-bottom: 30px; }
        .counter-strip.visible { display: grid; }
        .stat-box { background: #fffdf5; padding: 15px; }
        .stat-label { font-size: 0.6rem; color: #8a8375; display: block; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 4px; }
        .stat-value { font-size: 1.3rem; font-weight: 300; }

        /* Main Area */
        .stage-area { display: none; min-height: 180px; }
        .stage-area.visible { display: block; }
        .q-text { font-size: 1.6rem; font-weight: 300; margin-bottom: 15px; line-height: 1.3; color: #111; }
        .q-guide { font-size: 0.95rem; color: #777; font-style: italic; margin-bottom: 30px; line-height: 1.5; }

        /* Buttons */
        .btn-group { display: flex; justify-content: center; gap: 15px; margin-top: 10px; }
        .gemini-btn { padding: 14px 35px; background: #1a1a1a; color: #fff; border: none; cursor: pointer; font-size: 0.75rem; letter-spacing: 2px; text-transform: uppercase; transition: all 0.3s ease; }
        .gemini-btn:hover { background: #333; transform: translateY(-1px); }
        .gemini-btn.secondary { background: #fff; color: #1a1a1a; border: 1px solid #1a1a1a; }
        .gemini-btn.secondary:hover { background: #f4f4f4; }

        /* Footer Branding */
        footer { margin-top: 40px; padding-top: 20px; border-top: 1px solid #eee; }
        .tagline { font-size: 0.8rem; font-weight: 600; letter-spacing: 2px; color: #1a1a1a; text-transform: uppercase; }

        /* Results */
        .result-screen { display: none; animation: fadeIn 0.5s ease; }
        .result-screen.visible { display: block; }
        #rDesc { margin: 25px 0; color: #444; line-height: 1.7; font-size: 1rem; text-align: left; background: #fdfdfd; padding: 25px; border-radius: 4px; border: 1px solid #efefef; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>FortuneReader</h1>
            <div class="subtitle">The AI Software for Counselors</div>
        </header>

        <div class="counter-strip" id="counterStrip">
            <div class="stat-box"><span class="stat-label">Candidate Pool</span><span class="stat-value" id="valCur">—</span></div>
            <div class="stat-box" style="cursor:pointer" onclick="handleAnswer('YES')"><span class="stat-label">If Agree</span><span class="stat-value" id="valYes">—</span></div>
            <div class="stat-box" style="cursor:pointer" onclick="handleAnswer('NO')"><span class="stat-label">If Disagree</span><span class="stat-value" id="valNo">—</span></div>
        </div>

        <div id="welcome">
            <button class="gemini-btn" onclick="document.getElementById('csvFile').click()">Analyze Dataset</button>
        </div>
        <input type="file" id="csvFile" accept=".csv" style="display: none;" />

        <div class="stage-area" id="stageArea">
            <div id="qText" class="q-text"></div>
            <div id="qGuide" class="q-guide"></div>
            <div class="btn-group">
                <button class="gemini-btn" onclick="handleAnswer('YES')">Agree</button>
                <button class="gemini-btn secondary" onclick="handleAnswer('NO')">Disagree</button>
            </div>
        </div>

        <div class="result-screen" id="resultArea">
            <h2 id="rTitle" style="font-weight:300; font-size:2rem; margin-bottom:10px;"></h2>
            <div id="rDesc"></div>
            <div class="btn-group">
                <button class="gemini-btn" onclick="copyAIPrompt()">Prepare AI Strategy</button>
                <button class="gemini-btn secondary" onclick="location.reload()">Reset Session</button>
            </div>
        </div>

        <footer>
            <div class="tagline">Make Your Students AI-Proof</div>
        </footer>
    </div>

<script>
    let db = { R: [], Q: [], L: [] };
    let pool = []; 
    let state = { stage: 1, s1Idx: 0, current: null };

    document.getElementById('csvFile').onchange = (e) => {
        Papa.parse(e.target.files[0], {
            header: false, skipEmptyLines: true,
            complete: (res) => {
                db = { R: [], Q: [], L: [] };
                res.data.forEach(row => {
                    const cells = row.map(c => c ? c.toString().trim() : "");
                    const pdMatch = cells.find(c => /^PD\d+$/i.test(c)); 
                    const qMatch = cells.find(c => /^Q\d+$/i.test(c));

                    if (pdMatch && qMatch) {
                        db.L.push({ r: pdMatch.toUpperCase(), q: qMatch.toUpperCase() });
                    } else if (qMatch) {
                        db.Q.push({ id: qMatch.toUpperCase(), text: cells[2], stage: cells[3], cat: cells[4].toUpperCase(), guide: cells[5] || "" });
                    } else if (pdMatch) {
                        db.R.push({ id: pdMatch.toUpperCase(), name: cells[2], cat: cells[4].toUpperCase(), desc: cells[5] || "" });
                    }
                });
                pool = db.R.map(r => r.id);
                document.getElementById('welcome').style.display = 'none';
                document.getElementById('counterStrip').classList.add('visible');
                document.getElementById('stageArea').classList.add('visible');
                ask();
            }
        });
    };

    function ask() {
        if (state.stage === 1) {
            let qs = db.Q.filter(q => q.stage.toUpperCase().includes('STAGE1'));
            if (state.s1Idx >= qs.length) { state.stage = 2; ask(); return; }
            state.current = qs[state.s1Idx];
            let yesCount = db.R.filter(r => r.cat === state.current.cat).length;
            updateUI(state.current.text, state.current.guide, pool.length, yesCount, pool.length);
        } else {
            let qs = db.Q.filter(q => q.stage.toUpperCase().includes('STAGE2'));
            let matrix = qs.map(q => {
                let matches = pool.filter(id => db.L.some(l => l.r === id && l.q === q.id));
                return { q, count: matches.length };
            }).filter(m => m.count > 0 && m.count < pool.length);

            matrix.sort((a, b) => b.count - a.count);
            if (matrix.length === 0) { showResults(); return; }
            state.current = matrix[0].q;
            updateUI(state.current.text, state.current.guide, pool.length, matrix[0].count, pool.length - matrix[0].count);
        }
    }

    function handleAnswer(ans) {
        if (state.stage === 1) {
            if (ans === 'YES') {
                pool = db.R.filter(r => r.cat === state.current.cat).map(r => r.id);
                state.stage = 2;
            } else { state.s1Idx++; }
        } else {
            let linked = db.L.filter(l => l.q === state.current.id).map(l => l.r);
            pool = (ans === 'YES') ? pool.filter(id => linked.includes(id)) : pool.filter(id => !linked.includes(id));
        }
        ask();
    }

    function updateUI(t, g, p, y, n) {
        document.getElementById('qText').innerText = t;
        document.getElementById('qGuide').innerText = g || "";
        document.getElementById('valCur').innerText = p;
        document.getElementById('valYes').innerText = y;
        document.getElementById('valNo').innerText = n;
    }

    function showResults() {
        document.getElementById('stageArea').classList.remove('visible');
        document.getElementById('counterStrip').classList.remove('visible');
        document.getElementById('resultArea').classList.add('visible');
        let final = db.R.find(r => r.id === pool[0]) || { name: "Selection Finalized", desc: "Consult the counselor's guide for additional AI-proofing strategies." };
        document.getElementById('rTitle').innerText = final.name;
        document.getElementById('rDesc').innerText = final.desc;
    }

    function copyAIPrompt() {
        const title = document.getElementById('rTitle').innerText;
        const desc = document.getElementById('rDesc').innerText;
        const prompt = `I am a student exploring a career in: ${title}. \n\nCareer Context: ${desc}\n\nAct as a career counselor. Please provide a roadmap for this student, specifically focusing on how they can build human-centric skills that are 'AI-proof' within this specific industry.`;
        navigator.clipboard.writeText(prompt);
        alert("AI Roadmap Prompt copied.");
    }
</script>
</body>
</html>
